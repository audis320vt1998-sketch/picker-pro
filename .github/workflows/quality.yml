name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        if: ${{ always() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: npm audit --omit=dev --audit-level=high

  staging-container:
    name: Staging container
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate container definitions
        run: |
          docker compose -f compose.staging.yml config --quiet
          docker build --check .

      - name: Build staging image
        run: docker compose -f compose.staging.yml build --pull

      - name: Audit staging image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: picker-pro:staging
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.74.0

      - name: Start staging container
        run: >-
          docker compose -f compose.staging.yml up
          --detach --no-build --wait --wait-timeout 300

      - name: Verify staging runtime
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health | tee /tmp/picker-pro-health.json
          jq --exit-status '.status == "degraded"' /tmp/picker-pro-health.json
          docker compose -f compose.staging.yml exec -T app node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { Worker } = require('node:worker_threads')

          async function verifyRuntime() {
            if (typeof process.getuid !== 'function' || process.getuid() === 0) {
              throw new Error('container must run as non-root')
            }

            const runtimeFiles = [
              'tesseract.js',
              'tesseract.js/src/worker-script/node/index.js',
              'tesseract.js-core/tesseract-core-simd-lstm',
              'tesseract.js-core/tesseract-core-simd-lstm.wasm',
              'tesseract.js-core/tesseract-core-lstm.wasm',
            ]
            for (const id of runtimeFiles) {
              console.log(require.resolve(id))
            }

            for (const target of [
              '/app/.next/cache',
              process.env.PICKER_PRO_OCR_CACHE,
              '/tmp',
            ]) {
              const sentinel = path.join(target, `.picker-pro-ci-${process.pid}`)
              fs.writeFileSync(sentinel, 'ok', { flag: 'wx' })
              fs.rmSync(sentinel)
            }

            const worker = new Worker(
              require.resolve('tesseract.js/src/worker-script/node/index.js')
            )
            await new Promise((resolve, reject) => {
              const timer = setTimeout(resolve, 500)
              worker.once('error', (error) => {
                clearTimeout(timer)
                reject(error)
              })
            })
            await worker.terminate()
          }

          verifyRuntime().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
          docker compose -f compose.staging.yml exec -T app sh -c 'timeout --kill-after=10s 180s node /app/scripts/staging-runtime-canary.cjs'

      - name: Show staging logs on failure
        if: ${{ failure() }}
        run: docker compose -f compose.staging.yml logs --no-color

      - name: Stop staging container
        if: ${{ always() }}
        run: docker compose -f compose.staging.yml down --volumes --remove-orphans
